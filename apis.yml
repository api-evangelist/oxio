aid: oxio
name: OXIO
description: >-
  OXIO is a Telecom-as-a-Service (TaaS) platform that lets brands, enterprises,
  and fintechs launch and operate their own branded mobile networks (MVNOs)
  through a single API, without building traditional telecom infrastructure.
  Its API-first platform unifies multiple carriers behind one integration and
  layers on no-code service creation (BrandVNO), AI-driven subscriber and network
  intelligence (BrandIQ), and multi-carrier connectivity (OXIO Network). Developers
  use OXIO's RESTful APIs and sandbox for programmatic line and subscription
  management, payments, fraud detection, and CRM/ERP synchronization. OXIO was
  surfaced as a portfolio company of Multicoin Capital (its GitHub org carries
  Stellar blockchain SDK forks) and enriched from its public web surface; the full
  developer documentation is gated behind authorized-customer access.
